# Weekly test run: installs Jarvis with the real installer (install.sh) on a GitHub runner set up like the planned
# Oracle server (ARM64 Ubuntu, the model on 2 CPU cores), adds fake data, and runs tests/ci/run_tests.py, so the
# installer, the code, Hermes and the Qwen3 4B model are tested together. No secrets are used and none of the
# owner's data is involved, so the public logs and reports are safe to share.
name: Weekly tests

on:
  schedule:
    - cron: "30 20 * * 6"   # Sunday 02:00 India time (Saturday 20:30 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-tests-${{ github.ref }}   # one run per branch; a new push replaces that branch's run only
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04-arm   # ARM64 like the Oracle Ampere A1 server
    timeout-minutes: 240
    env:
      JARVIS_CI: "1"
      JARVIS_DB_HOST: 127.0.0.1
      JARVIS_DB_PORT: "5432"
      JARVIS_DB_NAME: jarvis
      JARVIS_DB_USER: jarvis
      JARVIS_DB_PASSWORD: ci-only-throwaway
      JARVIS_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      # The fake data is Indian (rupees, Tamil documents); other countries only change these settings.
      JARVIS_LOCALE: en_IN
      JARVIS_CURRENCY: INR
      JARVIS_OWNER_NAME: Test
      JARVIS_LANGUAGES: Tamil and English (Tanglish too)
    steps:
      - uses: actions/checkout@v4

      - name: Cache the search reranker
        uses: actions/cache@v4
        with:
          path: models
          key: reranker-bge-v2-m3-int8-v1

      - name: Install Jarvis (install.sh) and add fake data
        run: tests/ci/setup.sh

      - name: Unit tests
        run: .venv/bin/python -m unittest discover tests -v

      - name: Test cases
        id: cases
        continue-on-error: true
        run: .venv/bin/python tests/ci/run_tests.py --out reports

      - name: Report on the run page
        if: always()
        run: |
          if [ -f reports/report.md ]; then cat reports/report.md >> "$GITHUB_STEP_SUMMARY"; else echo "No report was written." >> "$GITHUB_STEP_SUMMARY"; fi
          mkdir -p reports && cp logs/*.log reports/ 2>/dev/null || true
          sudo journalctl -u jarvis-hermes -u jarvis-web -u ollama --no-pager > reports/services.log 2>&1 || true

      - name: Upload the report (HTML + CSV + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-test-report
          path: reports/
          retention-days: 90

      - name: Fail when a test case failed
        if: steps.cases.outcome == 'failure'
        run: exit 1
