[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis personal assistant: document ingestion and RAG search over ~/Jarvis"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]",
  "pgvector",
  "fastembed",
  "pypdf",
  "python-docx",
  "mcp[cli]>=2.3,<3",
  "watchdog",
  "httpx",
  "caldav",
  "recurring-ical-events",
  "google-api-python-client",
  "google-auth-oauthlib",
  "starlette",
  "uvicorn",
  "pywebpush",
  "py-vapid",
]

[project.scripts]
jarvis-ingest = "jarvis.ingest:main"
jarvis-search = "jarvis.search:main"
jarvis-mcp = "jarvis.mcp_server:main"
jarvis-auth = "jarvis.auth:main"
jarvis-briefing = "jarvis.briefing:briefing"
jarvis-weekly = "jarvis.briefing:weekly"
jarvis-monthly = "jarvis.briefing:monthly"
jarvis-web = "jarvis.web.server:main"
jarvis-notify = "jarvis.web.notify:main"
jarvis-renewal-alerts = "jarvis.renewals:alerts"
jarvis-task-sync = "jarvis.briefing:task_sync"
jarvis-reminders = "jarvis.briefing:reminders"
jarvis-google-check = "jarvis.briefing:google_check"
jarvis-money-sync = "jarvis.money:main"
jarvis-drive-sync = "jarvis.drive:main"
jarvis-learn = "jarvis.learn:main"
jarvis-memory-review = "jarvis.learn:weekly_review"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jarvis"]
