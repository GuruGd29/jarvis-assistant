<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis design mockup</title>
<style>
/* Design mockup for the Jarvis web app (sample data). ?theme=light|dark  &screen=chat|today|money|more|lock  or &board=1 */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
  --radius-xl: 28px; --radius-lg: 22px; --radius-md: 16px; --radius-sm: 12px;
}
[data-theme="light"] {
  --bg-1: #eef1ff; --bg-2: #fff4ec;
  --blob-a: rgba(124, 136, 255, .55); --blob-b: rgba(255, 166, 120, .45); --blob-c: rgba(94, 214, 199, .40);
  --glass: rgba(255, 255, 255, .55); --glass-strong: rgba(255, 255, 255, .72); --glass-weak: rgba(255, 255, 255, .34);
  --glass-edge: rgba(255, 255, 255, .85); --glass-edge-dim: rgba(255, 255, 255, .45);
  --shadow: 0 10px 30px rgba(40, 45, 90, .12), 0 1px 2px rgba(40, 45, 90, .08);
  --text: #11131a; --text-2: rgba(17, 19, 26, .62); --text-3: rgba(17, 19, 26, .40);
  --accent: #4f5bff; --accent-2: #7a5cff; --accent-text: #ffffff;
  --green: #1aa36b; --orange: #e8730c; --red: #e5484d; --separator: rgba(17, 19, 26, .08);
}
[data-theme="dark"] {
  --bg-1: #070a14; --bg-2: #0d1022;
  --blob-a: rgba(91, 104, 255, .45); --blob-b: rgba(203, 92, 255, .30); --blob-c: rgba(32, 201, 176, .28);
  --glass: rgba(255, 255, 255, .08); --glass-strong: rgba(255, 255, 255, .13); --glass-weak: rgba(255, 255, 255, .05);
  --glass-edge: rgba(255, 255, 255, .22); --glass-edge-dim: rgba(255, 255, 255, .10);
  --shadow: 0 10px 34px rgba(0, 0, 0, .45), 0 1px 2px rgba(0, 0, 0, .4);
  --text: #f4f6ff; --text-2: rgba(244, 246, 255, .62); --text-3: rgba(244, 246, 255, .38);
  --accent: #7c86ff; --accent-2: #a68bff; --accent-text: #ffffff;
  --green: #3ddc97; --orange: #ffa94d; --red: #ff6b6b; --separator: rgba(255, 255, 255, .08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; }
body { background: #d9dce6; }
body.board { display: flex; gap: 36px; padding: 48px; align-items: flex-start; background: var(--board-bg, #e6e8ef); }
[data-theme="dark"] body.board, body.board[data-theme="dark"] { --board-bg: #05060b; }

/* ---------- device ---------- */
.device { width: 390px; height: 844px; position: relative; overflow: hidden; flex: none;
  background: linear-gradient(160deg, var(--bg-1), var(--bg-2)); }
.board .device { border-radius: 52px; box-shadow: 0 0 0 11px #0b0b0f, 0 0 0 12px #2a2a33, 0 40px 80px rgba(0,0,0,.35); }
.board .label { font: 600 15px var(--font); color: #6b6f80; text-align: center; margin-top: 26px; letter-spacing: .02em; }
.device::before, .device::after { content: ""; position: absolute; border-radius: 50%; filter: blur(50px); pointer-events: none; }
.device::before { width: 340px; height: 340px; left: -120px; top: 60px; background: var(--blob-a); }
.device::after { width: 300px; height: 300px; right: -110px; top: 420px; background: var(--blob-b); }
.blob-c { position: absolute; width: 260px; height: 260px; left: 90px; bottom: -80px; border-radius: 50%;
  background: var(--blob-c); filter: blur(55px); pointer-events: none; }
.status { height: 50px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 8px 36px;
  font: 600 16px var(--font); position: relative; z-index: 5; }
.status .icons { display: flex; gap: 6px; align-items: center; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px;
  border-radius: 20px; background: #000; z-index: 6; }
.screen { position: absolute; inset: 0; padding-top: 50px; overflow: hidden; z-index: 2; }
.scroll { height: 100%; overflow: hidden; padding: 4px 18px 140px; }

/* ---------- liquid glass ---------- */
.glass { position: relative; background: var(--glass); border-radius: var(--radius-lg);
  backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
  box-shadow: var(--shadow), inset 0 1px 0 var(--glass-edge), inset 0 -1px 0 var(--glass-edge-dim); }
.glass::before { /* specular sheen along the top edge */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 38%); opacity: .55; }
[data-theme="dark"] .glass::before { opacity: .18; }
.glass.strong { background: var(--glass-strong); }
.glass.pill { border-radius: 999px; }

/* ---------- typography ---------- */
.large-title { font: 700 34px/1.1 var(--font); letter-spacing: -.02em; margin: 6px 4px 2px; }
.subtitle { font: 500 15px var(--font); color: var(--text-2); margin: 0 4px 14px; }
.section { font: 600 13px var(--font); color: var(--text-2); text-transform: uppercase; letter-spacing: .06em;
  margin: 18px 6px 8px; display: flex; justify-content: space-between; }
.section a { color: var(--accent); text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 14px; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px 10px; position: relative; z-index: 4; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 30% 25%, #a5adff, var(--accent) 55%, var(--accent-2));
  box-shadow: 0 6px 16px rgba(79, 91, 255, .35), inset 0 1px 0 rgba(255,255,255,.6); font: 700 17px var(--font); }
.topbar .title { font: 650 18px var(--font); }
.topbar .sub { font: 500 12.5px var(--font); color: var(--text-2); display: flex; align-items: center; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(61,220,151,.18); }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; margin-left: auto; }

/* ---------- chat ---------- */
.chat { padding: 4px 14px 210px; display: flex; flex-direction: column; gap: 10px; }
.day { align-self: center; font: 600 12px var(--font); color: var(--text-2); padding: 5px 12px; margin: 4px 0; }
.msg { max-width: 82%; padding: 11px 14px; font: 400 16px/1.38 var(--font); }
.msg.me { align-self: flex-end; color: var(--accent-text); border-radius: 22px 22px 6px 22px;
  background: linear-gradient(160deg, var(--accent), var(--accent-2));
  box-shadow: 0 8px 22px rgba(79, 91, 255, .30), inset 0 1px 0 rgba(255,255,255,.35); }
.msg.jarvis { align-self: flex-start; border-radius: 22px 22px 22px 6px; }
.meta { font: 500 11.5px var(--font); color: var(--text-3); margin-top: 3px; }
.me + .meta { align-self: flex-end; margin-right: 6px; }
.card-in { margin-top: 9px; border-radius: 14px; padding: 10px 12px; background: var(--glass-weak);
  box-shadow: inset 0 0 0 1px var(--separator); font-size: 14.5px; display: flex; gap: 10px; align-items: center; }
.card-in b { font-weight: 650; }
.voice { display: flex; align-items: center; gap: 10px; }
.play { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.25); display: grid; place-items: center; }
.wave { display: flex; gap: 2.5px; align-items: center; height: 26px; }
.wave i { width: 3px; border-radius: 3px; background: rgba(255,255,255,.85); }
.transcript { font: 400 13.5px/1.35 var(--font); opacity: .85; margin-top: 6px; font-style: italic; }
.chips { position: absolute; left: 0; right: 0; bottom: 172px; display: flex; gap: 8px; padding: 0 14px; z-index: 4; }
.chip { padding: 9px 13px; font: 600 14px var(--font); white-space: nowrap; border-radius: 999px; }
.composer { position: absolute; left: 12px; right: 12px; bottom: 108px; height: 56px; display: flex; align-items: center;
  gap: 6px; padding: 0 7px; z-index: 4; }
.composer .field { flex: 1; font: 400 16.5px var(--font); color: var(--text-3); padding-left: 4px; }
.round { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.round.accent { background: linear-gradient(160deg, var(--accent), var(--accent-2)); color: #fff;
  box-shadow: 0 6px 16px rgba(79, 91, 255, .4), inset 0 1px 0 rgba(255,255,255,.45); }
.round.plain { background: var(--glass-weak); box-shadow: inset 0 0 0 1px var(--separator); }
.typing { display: flex; gap: 4px; padding: 14px 16px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }

/* ---------- tab bar ---------- */
.tabbar { position: absolute; left: 18px; right: 18px; bottom: 30px; height: 66px; display: flex; align-items: center;
  justify-content: space-around; padding: 0 6px; z-index: 5; }
.tab { flex: 1; height: 54px; border-radius: 999px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; font: 600 10.5px var(--font); color: var(--text-2); }
.tab svg { width: 24px; height: 24px; }
.tab.active { color: var(--accent); background: var(--glass-strong);
  box-shadow: inset 0 1px 0 var(--glass-edge), 0 4px 14px rgba(40, 45, 90, .10); }
.badge { position: absolute; margin: -22px 0 0 22px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--red);
  color: #fff; font: 700 10.5px/17px var(--font); text-align: center; padding: 0 4px; }
.home-ind { position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px;
  border-radius: 3px; background: var(--text); opacity: .85; z-index: 6; }

/* ---------- cards / rows ---------- */
.card { padding: 16px; }
.card + .card { margin-top: 12px; }
.hero { padding: 18px 18px 16px; }
.hero .hello { font: 650 21px var(--font); }
.hero .line { font: 400 15px/1.45 var(--font); color: var(--text-2); margin-top: 6px; }
.hero .stats { display: flex; gap: 8px; margin-top: 14px; }
.stat { flex: 1; padding: 10px 11px; border-radius: 14px; background: var(--glass-weak); box-shadow: inset 0 0 0 1px var(--separator); }
.stat b { display: block; font: 700 19px var(--font); }
.stat span { font: 500 12px var(--font); color: var(--text-2); }
.list { padding: 4px 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; height: 1px; background: var(--separator); }
.ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; color: #fff; }
.ico svg { width: 18px; height: 18px; }
.row .main { flex: 1; min-width: 0; }
.row .t { font: 500 16px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font: 400 13.5px var(--font); color: var(--text-2); margin-top: 1px; }
.row .r { font: 600 14px var(--font); color: var(--text-2); }
.check { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--text-3); flex: none; }
.btns { display: flex; gap: 6px; }
.btn { padding: 7px 13px; border-radius: 999px; font: 650 13.5px var(--font); }
.btn.go { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.btn.soft { background: var(--glass-weak); box-shadow: inset 0 0 0 1px var(--separator); color: var(--text-2); }
.pill-tag { font: 650 12px var(--font); padding: 3px 8px; border-radius: 999px; }

/* ---------- money ---------- */
.segment { display: flex; padding: 3px; margin: 0 2px 14px; }
.segment span { flex: 1; text-align: center; padding: 8px 0; border-radius: 999px; font: 600 14px var(--font); color: var(--text-2); }
.segment span.on { background: var(--glass-strong); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.08), inset 0 1px 0 var(--glass-edge); }
.total { padding: 20px 18px; }
.total .k { font: 500 14px var(--font); color: var(--text-2); }
.total .v { font: 700 40px/1.1 var(--font); letter-spacing: -.02em; margin-top: 4px; }
.total .d { margin-top: 8px; font: 600 14px var(--font); }
.spark { margin-top: 14px; height: 54px; width: 100%; }
.cat { padding: 12px 16px; }
.cat .top { display: flex; justify-content: space-between; align-items: baseline; font: 500 15.5px var(--font); }
.cat .top b { font-weight: 650; }
.bar { height: 8px; border-radius: 6px; background: var(--separator); margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; }
.chg { font: 600 12.5px var(--font); margin-left: 6px; }

/* ---------- more ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { padding: 16px; height: 112px; display: flex; flex-direction: column; justify-content: space-between; }
.tile .tt { font: 650 16px var(--font); }
.tile .ts { font: 500 13px var(--font); color: var(--text-2); }
.toggle { width: 51px; height: 31px; border-radius: 999px; background: var(--green); position: relative; flex: none;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.12); }
.toggle::after { content: ""; position: absolute; width: 27px; height: 27px; border-radius: 50%; top: 2px; right: 2px;
  background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.toggle.off { background: var(--separator); }
.toggle.off::after { right: auto; left: 2px; }

/* ---------- lock screen ---------- */
.lock .time { text-align: center; font: 700 86px/1 var(--font); letter-spacing: -.03em; margin-top: 34px; }
.lock .date { text-align: center; font: 600 19px var(--font); color: var(--text-2); margin-top: 6px; }
.notifs { position: absolute; left: 12px; right: 12px; top: 330px; display: flex; flex-direction: column; gap: 9px; }
.notif { display: flex; gap: 11px; padding: 13px 14px; border-radius: 24px; }
.notif .appi { width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 30% 25%, #a5adff, var(--accent) 55%, var(--accent-2)); font: 700 17px var(--font); }
.notif .h { display: flex; justify-content: space-between; font: 650 15px var(--font); }
.notif .h span { font: 500 13px var(--font); color: var(--text-2); }
.notif .b { font: 400 14.5px/1.35 var(--font); margin-top: 2px; }
.notif .acts { display: flex; gap: 6px; margin-top: 8px; }
.lockbar { position: absolute; bottom: 44px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 46px; }
</style>
</head>

const q = new URLSearchParams(location.search);
const theme = q.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

const names = { lock: "Notifications", chat: "Chat", today: "Today", money: "Money", more: "More" };

  document.body.classList.add("board");
  document.body.innerHTML = Object.keys(names).map(k =>
    `<div><div class="device"><div class="blob-c"></div>${screens[k]()}</div><div class="label">${names[k]}</div></div>`).join("");
} else {
  const k = q.get("screen") || "chat";
  document.body.innerHTML = `<div class="device"><div class="blob-c"></div>${screens[k]()}</div>`;
}
