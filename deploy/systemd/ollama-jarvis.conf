# Ollama settings for Jarvis on a CPU server; install.sh copies this to
# /etc/systemd/system/ollama.service.d/jarvis.conf. Only this machine can reach Ollama (127.0.0.1).
[Service]
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_FLASH_ATTENTION=1"
# 4-bit memory for the 64k context: about 2.7 GB instead of 9 GB, so it fits a 12 GB server. (Without flash attention
# a 2-core ARM server reads messages about twice as fast, but the memory can't be shrunk then: a 24k window already
# took 9.9 GB, and Hermes refuses any window under 64k.)
Environment="OLLAMA_KV_CACHE_TYPE=q4_0"
# Keep the chat and search models loaded; reloading costs a minute or more on a CPU.
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_MAX_LOADED_MODELS=3"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_NO_CLOUD=1"
