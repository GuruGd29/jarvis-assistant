# Hermes Agent settings for Jarvis, written to ~/.hermes/config.yaml by install.sh (and by the weekly test run, so
# what is tested is what gets installed). __VENV__ becomes the Jarvis venv. Telegram starts only when
# TELEGRAM_BOT_TOKEN is set in ~/.hermes/.env. Web search, voice and anything that needs an outside account are off.
# Only the memory tool is switched on besides Jarvis's own: every tool's description is part of every prompt,
# and skills and past-chat search (about 2,200 tokens, never used) made each cold start minutes longer on 2 cores.
_config_version: 51
agent:
  execution_guidance: false
  task_completion_guidance: false
  parallel_tool_call_guidance: false
  max_turns: 500
  reasoning_effort: none
  verbose: false
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_first_n: 3
  protect_last_n: 20
  progress_notices: false
display:
  streaming: true
gateway:
  api_server:
    max_concurrent_runs: 4
mcp_servers:
  jarvis-rag:
    command: __VENV__/bin/jarvis-mcp
    args: []
    timeout: 300
memory:
  memory_char_limit: 2200
  memory_enabled: true
  nudge_interval: 10
  prefetch_spill_enabled: false
  provider: jarvis
  user_char_limit: 1375
  user_profile_enabled: true
model:
  base_url: http://127.0.0.1:11434/v1
  context_length: 65536
  default: qwen3-4b-instruct-64k
  provider: ollama-launch
platform_toolsets:
  api_server:
    - memory
  telegram:
    - memory
providers:
  ollama-launch:
    api: http://127.0.0.1:11434/v1
    default_model: qwen3-4b-instruct-64k
    models:
      - qwen3-4b-instruct-64k
    name: Ollama
streaming:
  enabled: false
stt:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
    send: false
tools:
  tool_search:
    enabled: "off"
toolsets:
  - memory
updates:
  check: false
